version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_driver_backend
    ports:
      - "8000:8000"
    environment:
      - EXECUTION_MODE=cloud
      - CARLA_HOST=carla_server
      - CARLA_PORT=2000
    env_file:
      - .env
    restart: unless-stopped

  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_gpu_worker
    command: ["python", "-m", "ai_worker.worker"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - EXECUTION_MODE=cloud
    restart: unless-stopped
